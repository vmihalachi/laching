name: Windows release (reusable)

# A companion app's Microsoft Store release, called from the app's own short workflow (laching/tools/skills/
# release-windows): both Native AOT packages built, checked native and smoke-tested by laching/tools/windows/
# store-release.ps1 (each platform in its own job), bundled into <Name>_<version>_x64_arm64.msixbundle (the run's
# artifact), optionally pushed to Partner Center (laching/tools/store/push-microsoft.py: a draft submission, or one sent
# to certification), and tagged win-<version> so every uploaded build traces back to its commit. The version is the
# Identity Version of the app's Package.appxmanifest; a version whose tag exists is refused before anything builds.
# Everything app-specific comes from the app's companion.json, read by the tools of the app's laching/ submodule, so the
# caller's @vX.Y.Z must be the release the app pins (companion.py conform checks it).
#
# The caller:
#   on: { workflow_dispatch: { inputs: { hosted: ..., tag: ..., store: ... } } }
#   permissions: { contents: write }
#   jobs:
#     release:
#       uses: vmihalachi/laching/.github/workflows/windows-release.yml@vX.Y.Z
#       with: { hosted: ..., tag: ..., store: ... }   (each ${{ inputs.<name> }}, block style: laching/tools/README.md)
#       secrets: inherit
#
# By default it runs on the self-hosted Windows ARM64 runner (`runner`), which smoke-tests both packages (x64 under
# emulation) next to the Store copy installed there; `hosted` runs it on GitHub's runners (Windows minutes bill at 2x),
# where only the x64 package can start. A push needs the MS_STORE_TENANT_ID, MS_STORE_CLIENT_ID and MS_STORE_CLIENT_SECRET
# secrets (laching/tools/store/microsoft-api-setup.md); screenshots and art stay a local step.
on:
  workflow_call:
    inputs:
      hosted:
        description: "GitHub-hosted runners instead of `runner` (Windows minutes bill at 2x; only x64 starts)"
        type: boolean
        default: false
      tag:
        description: "Tag the commit win-<version> once it passed (and was pushed); refuses a version tagged before"
        type: boolean
        default: true
      store:
        description: "Microsoft Store: none; draft (a submission with this bundle and the listing text, not sent); submit (sent to certification)"
        type: string
        default: none
      runner:
        description: "The self-hosted runner's labels, as JSON"
        type: string
        default: '["self-hosted","Windows","ARM64"]'
      laching-path:
        description: "The app's Laching submodule (companion.json's laching.path)"
        type: string
        default: laching
      submodules:
        description: "actions/checkout's submodules: true for an app whose package needs another submodule (its voices), else false (only laching/ is checked out)"
        type: string
        default: "false"
    secrets:
      MS_STORE_TENANT_ID:
        required: false
      MS_STORE_CLIENT_ID:
        required: false
      MS_STORE_CLIENT_SECRET:
        required: false
    outputs:
      version:
        description: "The package version released"
        value: ${{ jobs.version.outputs.version }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  version:
    runs-on: ${{ inputs.hosted && 'ubuntu-latest' || fromJSON(inputs.runner) }}
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Check out ${{ inputs.laching-path }}/
        run: git submodule update --init "${{ inputs.laching-path }}"

      # setup-dotnet runs on GitHub's runners only. On the self-hosted one an SDK older than a project's target
      # framework, or one the app's windows/global.json refuses, stops the release in this first job with "update the
      # runner's SDK to X" (tools/windows/check-sdk.py), before either package starts to publish, and each package job
      # asks again, as it may land on another runner with the same labels.
      - name: The runner's .NET SDK
        if: ${{ !inputs.hosted }}
        run: python "${{ inputs.laching-path }}/tools/windows/check-sdk.py"

      - name: Read the package version (and refuse one released before)
        id: read
        run: |
          $arguments = @{ VersionOnly = $true; AnyVersion = ('${{ inputs.tag }}' -ne 'true') }
          & "${{ inputs.laching-path }}/tools/windows/store-release.ps1" @arguments

  package:
    needs: version
    runs-on: ${{ inputs.hosted && 'windows-latest' || fromJSON(inputs.runner) }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: ${{ inputs.submodules }}

      - name: Check out ${{ inputs.laching-path }}/
        run: git submodule update --init "${{ inputs.laching-path }}"

      # The SDK of the runner this job landed on, as in the version job.
      - name: The runner's .NET SDK
        if: ${{ !inputs.hosted }}
        run: python "${{ inputs.laching-path }}/tools/windows/check-sdk.py"

      # The newest .NET 11 SDK, never the image's a patch behind (tools/windows/dotnet-sdk.ps1's latitude), unless the
      # app's windows/global.json pins another: the app publishes Native AOT, so the runtime it ships is the SDK's, and
      # store-release.ps1 publishes in windows.dir, where that global.json picks the SDK (a latestFeature pin still
      # picks the newest). setup-dotnet installs both; when the image's is the newest, nothing downloads. The
      # self-hosted runner keeps its own .NET 11 SDK, which the step above checked against that pin.
      - name: The app's global.json
        id: app
        if: inputs.hosted
        shell: pwsh
        run: |
          $windows = (Get-Content companion.json -Raw -Encoding UTF8 | ConvertFrom-Json -AsHashtable).windows
          if (-not $windows -or -not $windows.dir) { throw "companion.json has no windows.dir." }
          if (-not (Test-Path -LiteralPath $windows.dir -PathType Container)) { throw "companion.json's windows.dir is $($windows.dir), which isn't a folder." }
          $pin = "$($windows.dir)/global.json"
          "global-json=$(if (Test-Path -LiteralPath $pin -PathType Leaf) { $pin })" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v6
        if: inputs.hosted
        with:
          dotnet-version: "11.0.x"
          global-json-file: ${{ steps.app.outputs.global-json }}

      # The install check needs Developer Mode (the package is unsigned). On by hand on the self-hosted runner, whose
      # service has no admin rights to turn it on.
      - name: Developer Mode
        if: inputs.hosted && matrix.platform == 'x64'
        shell: powershell
        run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d 1

      # Publish, check native, install fresh and start. GitHub's x64 runner can't run ARM64: that package is checked
      # native only (start it on an ARM64 PC before uploading). On the self-hosted runner the test install goes next to
      # the Store copy installed there.
      - name: Build and check the ${{ matrix.platform }} package
        shell: powershell
        run: |
          $arguments = @{ Platforms = '${{ matrix.platform }}'; Out = "$env:RUNNER_TEMP\AppPackages"; NoBundle = $true; AnyVersion = $true }
          if ('${{ inputs.hosted }}' -eq 'true') { $arguments.NoSmoke = ('${{ matrix.platform }}' -ne 'x64') } else { $arguments.SideBySide = $true }
          & "${{ inputs.laching-path }}/tools/windows/store-release.ps1" @arguments

      - uses: actions/upload-artifact@v7
        with:
          name: msix-${{ matrix.platform }}
          path: ${{ runner.temp }}/AppPackages/**/*_${{ needs.version.outputs.version }}_${{ matrix.platform == 'x64' && 'x64' || 'arm64' }}.msix
          if-no-files-found: error

  bundle:
    needs: [version, package]
    runs-on: ${{ inputs.hosted && 'windows-latest' || fromJSON(inputs.runner) }}
    timeout-minutes: 20
    # The only job that writes: the tag.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check out ${{ inputs.laching-path }}/
        run: git submodule update --init "${{ inputs.laching-path }}"

      - uses: actions/download-artifact@v7
        with:
          pattern: msix-*
          path: ${{ runner.temp }}/packages

      - uses: actions/setup-python@v7
        if: inputs.hosted && inputs.store != 'none'
        with:
          python-version: "3.12"

      # makeappx comes with the Windows SDK on the runners. The push and the tag only after the bundle, so a failed push
      # tags nothing.
      - name: Bundle (and push to the Microsoft Store, and tag)
        id: bundle
        shell: powershell
        env:
          MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
        run: |
          if ('${{ inputs.store }}' -notin 'none', 'draft', 'submit') { throw "store is none, draft or submit, not '${{ inputs.store }}'." }
          if ('${{ inputs.store }}' -ne 'none' -and -not $env:MS_STORE_CLIENT_SECRET) {
            throw "A push needs the MS_STORE_* secrets (laching/tools/store/microsoft-api-setup.md) and the caller's secrets: inherit."
          }
          $arguments = @{ BundleFrom = "$env:RUNNER_TEMP\packages"; Out = "$env:RUNNER_TEMP\bundle"; Store = '${{ inputs.store }}'; AnyVersion = $true }
          if ('${{ inputs.tag }}' -eq 'true') { $arguments.Tag = $true }
          & "${{ inputs.laching-path }}/tools/windows/store-release.ps1" @arguments

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.bundle.outputs.bundle }}
        with:
          name: bundle-${{ needs.version.outputs.version }}
          path: ${{ steps.bundle.outputs.bundle }}
          if-no-files-found: error
