name: .NET

# The pure packages (Laching.Core, Laching.Companion, Laching.Companion.Shell, Laching.Testing) build and test on Linux and Windows
# (every conformance vector); Laching.Windows and Laching.Windows.Companion build on the Windows runner, where their
# Win32 and WinRT calls can be exercised, with the fixture app (a WinUI app on them, never packed).
on:
  push:
    branches:
      - master
    paths:
      - "dotnet/**"
      - "conformance/**"
      - "Tests/LachingCompanionTests/Resources/**"
      - "Tests/LachingShellTests/Resources/**"
      - "tools/windows/**"
      - ".github/workflows/dotnet.yml"
  pull_request:
    paths:
      - "dotnet/**"
      - "conformance/**"
      - "Tests/LachingCompanionTests/Resources/**"
      - "Tests/LachingShellTests/Resources/**"
      - "tools/windows/**"
      - ".github/workflows/dotnet.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Check C# formatting (dotnet/.editorconfig)
        run: dotnet format whitespace dotnet --folder --verify-no-changes

      # The pure packages and their tests only: Laching.Windows needs MakePri.exe (Windows App SDK), so the windows
      # job builds it.
      - name: Build
        run: |
          dotnet build dotnet/Laching.Core.Tests/Laching.Core.Tests.csproj -c Release
          dotnet build dotnet/Laching.Companion.Tests/Laching.Companion.Tests.csproj -c Release
          dotnet build dotnet/Laching.Companion.Shell.Tests/Laching.Companion.Shell.Tests.csproj -c Release
          dotnet build dotnet/Laching.Testing.Tests/Laching.Testing.Tests.csproj -c Release

      - name: Core tests (conformance/scheduler)
        run: dotnet test dotnet/Laching.Core.Tests/Laching.Core.Tests.csproj -c Release --no-build

      - name: Companion tests (conformance/companion)
        run: dotnet test dotnet/Laching.Companion.Tests/Laching.Companion.Tests.csproj -c Release --no-build

      - name: Companion shell tests (speech, delivery, signals, desktop layout)
        run: dotnet test dotnet/Laching.Companion.Shell.Tests/Laching.Companion.Shell.Tests.csproj -c Release --no-build

      - name: Testing tests (mocks, conformance helpers, fixtures)
        run: dotnet test dotnet/Laching.Testing.Tests/Laching.Testing.Tests.csproj -c Release --no-build

  # No NuGet cache (measured in #150): here restoring the 1 GB cache took 19 s against about 27 s of downloads, and
  # the job billed the same minutes; on Linux the restore takes a second.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # setup-dotnet downloads the newest .NET 10 SDK (300 MB, 30-odd seconds) whenever the image is a patch behind. The
      # image's own SDK does when it is in the newest feature band: the latitude web/global.json's latestPatch gives.
      - name: The image's .NET SDK
        id: sdk
        shell: pwsh
        run: |
          $band = { param($v) if ($v -match '^10\.0\.(\d)\d\d$') { $Matches[1] } }
          $image = dotnet --version 2>$null
          if ($LASTEXITCODE -ne 0) { $image = $null }
          $index = 'https://builds.dotnet.microsoft.com/dotnet/release-metadata/releases-index.json'
          $newest = try {
            (Invoke-RestMethod $index).'releases-index' | Where-Object 'channel-version' -eq '10.0' | ForEach-Object 'latest-sdk'
          } catch { }
          $use = $null -ne (& $band $image) -and (& $band $image) -eq (& $band $newest)
          "The image's SDK: $image; the newest: $newest; using the image's: $use"
          "use=$("$use".ToLower())" >> $env:GITHUB_OUTPUT
          exit 0

      - uses: actions/setup-dotnet@v6
        if: steps.sdk.outputs.use != 'true'
        with:
          dotnet-version: "10.0.x"

      # What builds and runs in Debug but breaks under Native AOT or in the XAML compiler (tools/windows/check-winui.py).
      - name: WinUI traps
        run: python tools/windows/check-winui.py dotnet/Fixture.App dotnet/Laching.Windows.Companion

      - name: Build Laching.Windows, Laching.Windows.Companion and the fixture app
        run: |
          dotnet build dotnet/Laching.Windows/Laching.Windows.csproj -c Release
          dotnet build dotnet/Laching.Windows.Companion/Laching.Windows.Companion.csproj -c Release
          dotnet build dotnet/Fixture.App/Fixture.App.csproj -c Release

      - name: Windows tests
        run: |
          dotnet test dotnet/Laching.Windows.Tests/Laching.Windows.Tests.csproj -c Release
          dotnet test dotnet/Laching.Windows.Companion.Tests/Laching.Windows.Companion.Tests.csproj -c Release

      # The same vectors under Windows' time zone database and math library.
      - name: Core, Companion, shell and Testing tests
        run: |
          dotnet test dotnet/Laching.Core.Tests/Laching.Core.Tests.csproj -c Release
          dotnet test dotnet/Laching.Companion.Tests/Laching.Companion.Tests.csproj -c Release
          dotnet test dotnet/Laching.Companion.Shell.Tests/Laching.Companion.Shell.Tests.csproj -c Release
          dotnet test dotnet/Laching.Testing.Tests/Laching.Testing.Tests.csproj -c Release
