name: Tools

# Tests the Python tools in tools/ (standard library only; the image tests also need Pillow, which they skip without),
# scripts/release.sh with release.yml's plan step, and the @laching/landing package (tools/landing, Node 24).
on:
  push:
    branches:
      - master
    paths:
      - "tools/**"
      - "Tests/Fixtures/**"
      - "scripts/fixture-art.sh"
      - "scripts/release.sh"
      - "scripts/verify.sh"
      - ".github/workflows/release.yml"
      - ".github/workflows/tools.yml"
  pull_request:
    paths:
      - "tools/**"
      - "Tests/Fixtures/**"
      - "scripts/fixture-art.sh"
      - "scripts/release.sh"
      - "scripts/verify.sh"
      - ".github/workflows/release.yml"
      - ".github/workflows/tools.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # For store-screenshots.py's tests and the other image ones, which would skip. The runner's python3 is the
      # system's (PEP 668), so into the user's site-packages.
      - name: Pillow
        run: python3 -m pip install --user --break-system-packages Pillow==11.3.0

      - name: Test the tools (tools/tests/run.py)
        run: python3 tools/tests/run.py

      - name: Check the fixture art is current
        run: scripts/fixture-art.sh --check

  landing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/landing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/landing/package-lock.json

      - run: npm ci

      - name: Types, lint, format
        run: npx tsc --noEmit && npx vp check

      - name: Test
        run: npx vp test run

      # The same pack as release.yml's landing job, into a folder of its own, so a tag never meets it first. A release
      # packs at a version above npm's latest (npm won't tag a lower one latest), so this packs at the next patch. npm
      # has no version of a package not published yet (@laching/landing before its first release, `npm view` fails
      # with E404), and then this packs at the next patch of package.json's, as release.yml's version job allows.
      - name: Pack (as the release does)
        run: |
          if published="$(npm view @laching/landing version 2>/dev/null)" && [ -n "$published" ]; then
            npm version "$published" --no-git-tag-version --allow-same-version
          else
            echo "npm has no version of @laching/landing yet: packing at the next patch of package.json's"
          fi
          npm version patch --no-git-tag-version
          mkdir -p "$RUNNER_TEMP/npm"
          npm pack --pack-destination "$RUNNER_TEMP/npm"
          ls -l "$RUNNER_TEMP/npm"/*.tgz

      # The release's npm job's command as a dry run, from the same relative path (no login and no --provenance, which
      # needs the job's OIDC token: it publishes nothing).
      - name: Publish (dry run, as the release does)
        working-directory: ${{ runner.temp }}
        run: |
          npm install -g npm@^11.5.1
          npm publish ./npm/*.tgz --access public --dry-run
