name: Tools

# Tests the Python tools in tools/ (standard library only; the image tests also need Pillow, which they skip without),
# scripts/release.sh with release.yml's plan step, that the NuGet packages' READMEs link only absolutely, and the
# @laching/landing package (tools/landing, Node 24). release.yml calls it (workflow_call) with the commit it plans to
# tag, and tags nothing unless the tools pass: the apps run them from the submodule. Called, only the tools job runs:
# release.yml's own landing job tests and packs @laching/landing.
on:
  push:
    branches:
      - main
    paths:
      - "tools/**"
      - "Tests/Fixtures/**"
      - "scripts/fixture-art.sh"
      - "scripts/release.sh"
      - "scripts/verify.sh"
      - ".github/workflows/release.yml"
      - ".github/workflows/windows-app.yml"
      - ".github/workflows/windows-core.yml"
      - ".github/workflows/windows-release.yml"
      - ".github/workflows/tools.yml"
      - ".github/hooks/laching.json"
      - ".githooks/**"
      - "dotnet/README.md"
      - "dotnet/Directory.Build.targets"
      - "web/README.md"
      - "web/Directory.Build.targets"
  pull_request:
    paths:
      - "tools/**"
      - "Tests/Fixtures/**"
      - "scripts/fixture-art.sh"
      - "scripts/release.sh"
      - "scripts/verify.sh"
      - ".github/workflows/release.yml"
      - ".github/workflows/windows-app.yml"
      - ".github/workflows/windows-core.yml"
      - ".github/workflows/windows-release.yml"
      - ".github/workflows/tools.yml"
      - ".github/hooks/laching.json"
      - ".githooks/**"
      - "dotnet/README.md"
      - "dotnet/Directory.Build.targets"
      - "web/README.md"
      - "web/Directory.Build.targets"
  workflow_dispatch:
  workflow_call:
    inputs:
      commit:
        description: "The commit the caller will tag: the run tests the branch's tip, which must be it"
        type: string
        required: true

permissions:
  contents: read

# Called, github.workflow and github.ref are the caller's ("Release", main): a call gets a group of its own, which
# no push or other call cancels, and cancels nothing.
concurrency:
  group: >-
    ${{ inputs.commit && format('tools-call-{0}', inputs.commit)
    || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ !inputs.commit }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Called, the branch's tip as it is now (as release.yml's plan job checks it out), else the default.
      - uses: actions/checkout@v7
        id: checkout
        with:
          ref: ${{ inputs.commit && github.ref || '' }}

      - name: The branch's tip is the commit the caller planned
        if: inputs.commit && steps.checkout.outputs.commit != inputs.commit
        run: |
          echo "$GITHUB_REF moved since the plan"
          exit 1

      # For store-screenshots.py's tests and the other image ones, which would skip. The runner's python3 is the
      # system's (PEP 668), so into the user's site-packages.
      - name: Pillow
        run: python3 -m pip install --user --break-system-packages "Pillow>=11.3"

      - name: Test the tools (tools/tests/run.py)
        run: python3 tools/tests/run.py

      - name: Check the fixture art is current
        run: scripts/fixture-art.sh --check

  landing:
    if: ${{ !inputs.commit }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/landing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/landing/package-lock.json

      - run: npm ci

      - name: Types, lint, format
        run: npx tsc --noEmit && npx vp check

      - name: Test
        run: npx vp test run

      # The same pack as release.yml's landing job, into a folder of its own, so a tag never meets it first. A release
      # packs at a version above npm's latest (npm won't tag a lower one latest), so this packs at the next patch. npm
      # has no version of a package not published yet (@laching/landing before its first release, `npm view` fails
      # with E404), and then this packs at the next patch of package.json's, as release.yml's version job allows.
      - name: Pack (as the release does)
        run: |
          if published="$(npm view @laching/landing version 2>/dev/null)" && [ -n "$published" ]; then
            npm version "$published" --no-git-tag-version --allow-same-version
          else
            echo "npm has no version of @laching/landing yet: packing at the next patch of package.json's"
          fi
          npm version patch --no-git-tag-version
          mkdir -p "$RUNNER_TEMP/npm"
          npm pack --pack-destination "$RUNNER_TEMP/npm"
          ls -l "$RUNNER_TEMP/npm"/*.tgz

      # The release's npm job's command as a dry run, from the same relative path (no login and no --provenance, which
      # needs the job's OIDC token: it publishes nothing).
      - name: Publish (dry run, as the release does)
        working-directory: ${{ runner.temp }}
        run: |
          npm install -g npm@^11.5.1
          npm publish ./npm/*.tgz --access public --dry-run
