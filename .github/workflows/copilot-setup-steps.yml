name: Copilot setup steps

# Prepares GitHub Copilot's cloud coding agent (Ubuntu): the .NET 10 SDK and the restored test projects, so
# `dotnet test` works once the agent's firewall is up, and a JDK 17 with the Kotlin build's Gradle caches warm, so
# `./gradlew :core:test` does too. Swift needs macOS; the agent verifies it through swift.yml (see AGENTS.md). Also
# runs when edited, so a broken setup shows up in the PR.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  # Copilot only picks up a job with exactly this name.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # The four test projects that run anywhere (what verify.sh runs).
      - name: Restore the test projects
        run: dotnet restore dotnet/Laching.Tests.slnf

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Warm the Kotlin build's caches
        working-directory: kotlin
        run: ./gradlew :core:testClasses :testing:testClasses --console=plain
