name: Kotlin

# The Kotlin side (kotlin/): ktlint over every source, then :core's and :testing's tests (every scheduler vector among
# them) and the :android debug build, on a hosted Ubuntu runner, whose image carries the Android SDK. release.yml calls
# it (workflow_call) with the commit it plans to tag, and tags nothing unless it passes.
on:
  push:
    branches:
      - master
    paths:
      - "kotlin/**"
      - "conformance/**"
      - ".github/workflows/kotlin.yml"
  pull_request:
    paths:
      - "kotlin/**"
      - "conformance/**"
      - ".github/workflows/kotlin.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      commit:
        description: "The commit the caller will tag: the run tests the branch's tip, which must be it"
        type: string
        required: true

permissions:
  contents: read

# Called, github.workflow and github.ref are the caller's ("Release", master): a call gets a group of its own, which
# no push or other call cancels, and cancels nothing.
concurrency:
  group: >-
    ${{ inputs.commit && format('kotlin-call-{0}', inputs.commit)
    || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ !inputs.commit }}

env:
  # scripts/verify.sh reads KTLINT_VERSION too, and skips its ktlint check for any other version. A new version
  # takes the new download's sha256 here.
  KTLINT_VERSION: "1.8.0"
  KTLINT_SHA256: "a3fd620207d5c40da6ca789b95e7f823c54e854b7fade7f613e91096a3706d75"

jobs:
  kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: kotlin
    steps:
      # Called, the branch's tip as it is now (as release.yml's plan job checks it out), else the default.
      - uses: actions/checkout@v7
        id: checkout
        with:
          ref: ${{ inputs.commit && github.ref || '' }}

      # The checkout's own output, not git: in swift.yml's container git refuses the workspace (dubious ownership).
      - name: The branch's tip is the commit the caller planned
        if: inputs.commit && steps.checkout.outputs.commit != inputs.commit
        run: |
          echo "$GITHUB_REF moved since the plan"
          exit 1

      # Every gradle-wrapper.jar in the checkout is one Gradle published.
      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: ktlint
        run: |
          curl -fsSL "https://github.com/pinterest/ktlint/releases/download/$KTLINT_VERSION/ktlint" -o "$RUNNER_TEMP/ktlint"
          echo "$KTLINT_SHA256  $RUNNER_TEMP/ktlint" | sha256sum -c -
          chmod a+x "$RUNNER_TEMP/ktlint"
          "$RUNNER_TEMP/ktlint" "**/*.kt" "**/*.kts" "!**/build/**"

      - name: Tests and the Android build
        run: ./gradlew :core:test :testing:test :android:assembleDebug --console=plain
