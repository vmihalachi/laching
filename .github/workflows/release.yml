name: Release

# Releases are made on demand: Actions → Release → Run workflow, on master, with dry_run first: the plan job prints the
# plan (the next version and why, whether NuGet and @laching/landing ship) and stops before anything is built or
# written. One tag per release; the Swift package and the Kotlin build take the tag, NuGet and npm a new version only
# when their code changed since their last one. The plan is scripts/release.sh's, the same by hand: `plan` numbers the
# release from the pull requests merged since the last tag (a minor while 0.x, a major from 1.0, when one is labelled
# `breaking`, else a patch; the bump input overrides it, and nothing committed since the tag releases nothing), `nuget`
# whether the packages changed since LachingVersion (dotnet/Directory.Build.props), `web` whether the web packages
# changed since LachingWebVersion (web/Directory.Build.props), `landing` whether tools/landing changed since npm's version.
#
# Nothing remote is written until everything that ships has been tested and packed: the plan job bumps in its runner
# and checks the version strings (scripts/verify.sh --version); core, windows, web and landing test and pack that same bumped
# tree; only then does the tag job push the "X.Y.Z: release" commit and its vX.Y.Z tag, in one atomic push onto the
# master that was planned (when master moved meanwhile it pushes nothing: dispatch again). After the push, npm publishes
# @laching/landing and publish pushes the packages to NuGet.org and makes the GitHub release; both are re-runnable on
# their own. NuGet through Trusted Publishing (OIDC: no stored key; nuget.org → your account → Trusted Publishing → a
# policy for repository vmihalachi/laching and workflow release.yml, plus the NUGET_USER repository variable set to your
# nuget.org username). The release notes are generated from the merged pull requests' titles (grouped by
# .github/release.yml) with what shipped below them. Tags pushed with the workflow's token start no other workflow, so
# this run starts the site's deploy itself.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "auto: a minor while 0.x (a major from 1.0) when a pull request merged since the last tag is labelled breaking, else a patch"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry_run:
        description: "Only print the plan (the version and why, whether NuGet, the web packages and the landing ship) and stop"
        type: boolean
        default: false

permissions:
  contents: read

# One release at a time, a run waiting behind it planned from master as it is then; a dry run never waits or cancels.
concurrency:
  group: ${{ inputs.dry_run && format('release-dry-{0}', github.run_id) || 'release' }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  # Reads only. release is false when there is nothing to release or on a dry run, and every other job skips.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # the merged pull requests' labels
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      previous: ${{ steps.plan.outputs.previous }}
      base: ${{ steps.plan.outputs.base }}
      tree: ${{ steps.plan.outputs.tree }}
      nuget: ${{ steps.plan.outputs.nuget }}
      web: ${{ steps.plan.outputs.web }}
      landing: ${{ steps.plan.outputs.landing }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the tags, for the plan
          ref: ${{ github.ref }}  # the branch as it is when the run starts, not when it was queued
          persist-credentials: false

      - id: plan
        name: Plan (a dry run stops here)
        env:
          BUMP: ${{ inputs.bump }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          say() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          if [ "$DRY_RUN" != true ] && [ "$GITHUB_REF" != refs/heads/master ]; then
            echo "A release runs on master, not $GITHUB_REF (a dry run runs anywhere)"
            exit 1
          fi
          plan=$(scripts/release.sh plan --bump "$BUMP")  # set -e stops here when it fails; inside the read it wouldn't
          read -r action version why <<< "$plan"
          if [ "$action" = none ]; then
            say "Nothing to release: $plan"
            out release false
            exit 0
          fi
          [ "$action" = release ] || { echo "scripts/release.sh plan said '$plan'"; exit 1; }
          previous=$(sed -n 's/.*public static let version = "\([^"]*\)".*/\1/p' Sources/LachingCore/Laching.swift)
          nuget=$(scripts/release.sh nuget "$version")
          web=$(scripts/release.sh web "$version")
          landing=$(scripts/release.sh landing)
          say "Plan: $plan"
          say "NuGet: $nuget"
          say "Web packages: $web"
          say "@laching/landing: $landing"
          # Tags never move: a v$version already on origin stops the release here.
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
            echo "v$version already exists on origin (tags are protected and never move): fetch it and see what made it"
            exit 1
          fi
          # The release commit's tree, bumped here (nothing is committed): every later job bumps the same commit and
          # checks it gets this tree, so what is tested and packed is what gets tagged.
          scripts/release.sh bump "$version"
          scripts/verify.sh --version "$version"
          [ "$(scripts/release.sh nuget "$version" | cut -d' ' -f1)" = "${nuget%% *}" ] ||
            { echo "after the bump, scripts/release.sh nuget $version answers otherwise"; exit 1; }
          [ "$(scripts/release.sh web "$version" | cut -d' ' -f1)" = "${web%% *}" ] ||
            { echo "after the bump, scripts/release.sh web $version answers otherwise"; exit 1; }
          git add -A
          if [ "$DRY_RUN" = true ]; then
            say "Dry run: nothing was built, committed, tagged or published."
            out release false
            exit 0
          fi
          out release true
          out version "$version"
          out previous "$previous"
          out base "$(git rev-parse HEAD)"
          out tree "$(git write-tree)"
          out nuget "$([ "${nuget%% *}" = ship ] && echo true || echo false)"
          out web "$([ "${web%% *}" = ship ] && echo true || echo false)"
          out landing "$([ "${landing%% *}" = yes ] && echo true || echo false)"

  # The packages that build anywhere (Laching.Core, Laching.Companion, Laching.Companion.Shell, Laching.Testing): their
  # tests and packages, on Linux, from the bumped tree. Skipped, with windows and the NuGet push, when NuGet doesn't ship.
  core:
    needs: plan
    if: needs.plan.outputs.nuget == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TREE: ${{ needs.plan.outputs.tree }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the tags, for the bump (release.sh nuget diffs since v<LachingVersion>)
          ref: ${{ needs.plan.outputs.base }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Bump, as the release commit will be
        run: |
          scripts/release.sh bump "$VERSION"
          git add -A
          [ "$(git write-tree)" = "$TREE" ] || { echo "the bump doesn't give the planned tree"; exit 1; }

      - name: Test and pack (each at the release's version, which NuGet doesn't have yet)
        run: |
          for project in $(scripts/release.sh projects); do
            ! grep -q '<TargetFramework>[^<]*-windows' "dotnet/$project/$project.csproj" || continue
            tests="dotnet/$project.Tests/$project.Tests.csproj"
            if [ -f "$tests" ]; then dotnet test "$tests" -c Release; fi
            dotnet pack "dotnet/$project/$project.csproj" -c Release -o dotnet/artifacts
            [ -f "dotnet/artifacts/$project.$VERSION.nupkg" ] || { ls dotnet/artifacts; echo "$project isn't $VERSION"; exit 1; }
          done

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg-core
          path: dotnet/artifacts/*.nupkg

  # The packages with a -windows target (Laching.Windows, Laching.Windows.Companion) need the Windows App SDK's
  # MakePri.exe, so they test and pack on Windows.
  windows:
    needs: plan
    if: needs.plan.outputs.nuget == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TREE: ${{ needs.plan.outputs.tree }}
    steps:
      # The files as committed (LF), so release.sh runs and its bump gives the planned tree.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the tags, for the bump
          ref: ${{ needs.plan.outputs.base }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Bump, as the release commit will be
        run: |
          scripts/release.sh bump "$VERSION"
          git add -A
          [ "$(git write-tree)" = "$TREE" ] || { echo "the bump doesn't give the planned tree"; exit 1; }

      - name: Test and pack
        run: |
          for project in $(scripts/release.sh projects); do
            grep -q '<TargetFramework>[^<]*-windows' "dotnet/$project/$project.csproj" || continue
            tests="dotnet/$project.Tests/$project.Tests.csproj"
            if [ -f "$tests" ]; then dotnet test "$tests" -c Release; fi
            dotnet pack "dotnet/$project/$project.csproj" -c Release -o dotnet/artifacts
            [ -f "dotnet/artifacts/$project.$VERSION.nupkg" ] || { ls dotnet/artifacts; echo "$project isn't $VERSION"; exit 1; }
          done

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg-windows
          path: dotnet/artifacts/*.nupkg

  # The web packages (web/src, Laching.Web.*): their tests, the Jobs ones against a PostgreSQL service, and packages, at
  # the release's version. Skipped, with their part of the NuGet push, when the web packages don't ship.
  web:
    needs: plan
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TREE: ${{ needs.plan.outputs.tree }}
      LACHING_WEB_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the tags, for the bump (release.sh web diffs since v<LachingWebVersion>)
          ref: ${{ needs.plan.outputs.base }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: web/global.json

      - name: Bump, as the release commit will be
        run: |
          scripts/release.sh bump "$VERSION"
          git add -A
          [ "$(git write-tree)" = "$TREE" ] || { echo "the bump doesn't give the planned tree"; exit 1; }

      - name: Test and pack
        run: |
          dotnet test web/Laching.Web.sln -c Release
          for project in $(scripts/release.sh web-projects); do
            dotnet pack "web/src/$project/$project.csproj" -c Release -o web/artifacts
            [ -f "web/artifacts/$project.$VERSION.nupkg" ] || { ls web/artifacts; echo "$project isn't $VERSION"; exit 1; }
          done

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg-web
          path: web/artifacts/*.nupkg

  # @laching/landing (tools/landing) at the release's version: tested and packed here, published by `npm` after the
  # tag. Skipped, with `npm`, when tools/landing is unchanged since npm's version.
  landing:
    needs: plan
    if: needs.plan.outputs.landing == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/landing
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.base }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Test and pack
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          npm ci
          npx tsc --noEmit && npx vp test run
          npm version "$VERSION" --no-git-tag-version
          mkdir -p "$GITHUB_WORKSPACE/npm"
          npm pack --pack-destination "$GITHUB_WORKSPACE/npm"

      - uses: actions/upload-artifact@v7
        with:
          name: npm-landing
          path: npm/*.tgz

  # The first remote write, once everything that ships has been tested and packed: the release commit and its tag.
  tag:
    needs: [plan, core, windows, web, landing]
    if: >-
      !cancelled() && needs.plan.outputs.release == 'true' &&
      (needs.core.result == 'success' || needs.core.result == 'skipped') &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped') &&
      (needs.web.result == 'success' || needs.web.result == 'skipped') &&
      (needs.landing.result == 'success' || needs.landing.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write  # the site's deploy
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the tags, for the bump
          ref: ${{ needs.plan.outputs.base }}

      - id: tag
        name: Commit the bump and tag it, in one push
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          BASE: ${{ needs.plan.outputs.base }}
          TREE: ${{ needs.plan.outputs.tree }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/release.sh bump "$VERSION"
          git add -A
          [ "$(git write-tree)" = "$TREE" ] || { echo "the bump doesn't give the planned tree"; exit 1; }
          git commit -qm "$VERSION: release"
          git tag -a "v$VERSION" -m "Laching $VERSION"
          # Both land, on the master that was planned and tested, or neither does.
          if ! git push -q --atomic origin HEAD:refs/heads/master "refs/tags/v$VERSION"; then
            if [ "$(git ls-remote origin refs/heads/master | cut -f1)" != "$BASE" ]; then
              echo "master moved since the plan: nothing was pushed; dispatch the release again"
            else
              echo "origin refused the release commit and v$VERSION (a branch or tag rule, or the tag exists): nothing was pushed"
            fi
            exit 1
          fi
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Released $VERSION: v$VERSION at $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          # The site's version label (a push of ours starts nothing); a failure here strands nothing.
          gh workflow run pages.yml --ref master || echo "::warning::Couldn't start pages.yml: run it by hand"

  # @laching/landing to npm through Trusted Publishing (OIDC: no stored token; provenance attached), published directly:
  # the human gate is the release's dispatch. npmjs.com holds one trusted publisher for the package: repository
  # vmihalachi/laching, workflow release.yml, environment npm. Its own job, so only it can mint the token; when it fails,
  # re-run it.
  npm:
    needs: [plan, tag, landing]
    # !cancelled(): without a status function the implicit success() is false once core, windows or web was skipped.
    if: >-
      !cancelled() && needs.landing.result == 'success' && needs.tag.result == 'success'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: npm-landing
          path: npm

      # No registry-url: it writes a token line to .npmrc, and there is no token.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Publish @laching/landing
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          npm install -g npm@^11.5.1  # trusted publishing
          npm publish ./npm/*.tgz --access public --provenance  # ./: a bare npm/… reads as a GitHub repository
          echo "@laching/landing@$VERSION is published on npm." >> "$GITHUB_STEP_SUMMARY"

  # The NuGet push and the GitHub release, after the tag. When it fails, re-run this job (or npm, then this): the push
  # skips what NuGet has, and the release's upload replaces its assets.
  publish:
    needs: [plan, tag, npm]
    if: >-
      !cancelled() && needs.tag.result == 'success' &&
      (needs.npm.result == 'success' || needs.npm.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      LACHING_VERSION: ${{ needs.plan.outputs.version }}
      PREVIOUS: ${{ needs.plan.outputs.previous }}
      REF: ${{ needs.tag.outputs.ref }}
      NUGET: ${{ needs.plan.outputs.nuget }}
      WEB: ${{ needs.plan.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.ref }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        if: needs.plan.outputs.nuget == 'true' || needs.plan.outputs.web == 'true'
        with:
          dotnet-version: "10.0.x"

      - uses: actions/download-artifact@v7
        if: needs.plan.outputs.nuget == 'true' || needs.plan.outputs.web == 'true'
        with:
          pattern: nupkg-*
          path: dotnet/artifacts
          merge-multiple: true

      # Trusted Publishing: GitHub's OIDC token is exchanged for a one-hour NuGet.org API key scoped to this run.
      # Without the NUGET_USER variable the packages still land on the GitHub release below; set it (and the
      # nuget.org policy) and re-run this job to publish them.
      - name: Log in to NuGet.org (Trusted Publishing)
        if: vars.NUGET_USER != '' && (needs.plan.outputs.nuget == 'true' || needs.plan.outputs.web == 'true')
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet.org
        id: push
        if: needs.plan.outputs.nuget == 'true' || needs.plan.outputs.web == 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          ls -l dotnet/artifacts
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::warning::Not pushed to NuGet.org: set the NUGET_USER repository variable to your nuget.org username and add a Trusted Publishing policy there for vmihalachi/laching, workflow release.yml."
            exit 0
          fi
          dotnet nuget push "dotnet/artifacts/*.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # The landing's tarball, when this release published one, rides along on the GitHub release.
      - uses: actions/download-artifact@v7
        if: needs.npm.result == 'success'
        with:
          name: npm-landing
          path: npm

      # GitHub's notes from the merged pull requests' titles since the previous tag (categories: .github/release.yml),
      # then what shipped where.
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
          NPM: ${{ needs.npm.result }}
          LANDING: ${{ needs.plan.outputs.landing }}
          PUSHED: ${{ steps.push.outputs.pushed }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="v$LACHING_VERSION" \
            -f previous_tag_name="v$PREVIOUS" -f target_commitish="$REF" --jq .body > "$RUNNER_TEMP/notes.md"
          {
            echo
            echo "## Packages"
            echo
            where="on NuGet.org"
            [ "$PUSHED" = true ] || where="attached here, not on NuGet.org yet"
            if [ "$NUGET" = true ]; then
              echo "- NuGet: the six \`Laching.*\` packages at $LACHING_VERSION, $where"
            else
              at=$(sed -n 's/.*<LachingVersion[^>]*>\([^<]*\)<.*/\1/p' dotnet/Directory.Build.props)
              echo "- NuGet: unchanged, still $at"
            fi
            if [ "$WEB" = true ]; then
              echo "- NuGet: the six \`Laching.Web.*\` packages at $LACHING_VERSION, $where"
            else
              at=$(sed -n 's/.*<LachingWebVersion[^>]*>\([^<]*\)<.*/\1/p' web/Directory.Build.props)
              echo "- NuGet, web: unchanged, still $at"
            fi
            if [ "$NPM" = success ]; then
              echo "- \`@laching/landing\` $LACHING_VERSION: published to npm"
            elif [ "$LANDING" = true ]; then
              echo "- \`@laching/landing\` $LACHING_VERSION: changed, but not published to npm yet (the npm job: $NPM)"
            else
              echo "- \`@laching/landing\`: unchanged, not published"
            fi
            echo "- The Swift package and the Kotlin build: this tag"
          } >> "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=()
          if [ -d dotnet/artifacts ]; then assets+=(dotnet/artifacts/*.nupkg); fi
          if [ -d npm ]; then assets+=(npm/*.tgz); fi
          if gh release view "v$LACHING_VERSION" >/dev/null 2>&1; then
            if [ ${#assets[@]} -gt 0 ]; then gh release upload "v$LACHING_VERSION" "${assets[@]}" --clobber; fi
          else
            gh release create "v$LACHING_VERSION" "${assets[@]}" --title "v$LACHING_VERSION" --verify-tag \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
