name: Windows app

# The WinUI app built and checked on demand: Laching's reusable workflow, at the release the app pins (laching.tag).
on:
  workflow_dispatch:
    inputs:
      hosted:
        description: "Run on a GitHub-hosted Windows runner (bills Windows minutes at 2x)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    uses: vmihalachi/laching/.github/workflows/windows-app.yml@v0.5.0
    with:
      hosted: ${{ inputs.hosted }}
      languages: en,de
